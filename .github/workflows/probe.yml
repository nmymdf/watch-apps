name: probe-data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://www.tgos.tw/tgos/VirtualDir/Product/c2dd3a68-cafc-48fc-8a4a-7215ddc24cd3/1150720-%E5%9C%8B%E9%81%93%E5%85%AC%E8%B7%AF%E5%9B%BA%E5%AE%9A%E5%BC%8F%E6%B8%AC%E9%80%9F%E7%85%A7%E7%9B%B8%E5%9C%B0%E9%BB%9E.zip'
          for ref in "" "https://www.tgos.tw/" "https://data.gov.tw/dataset/13940"; do
            code=$(curl -sS -L -o /tmp/f.zip -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36" ${ref:+-e "$ref"} "$U"); echo "ref=[$ref] code=$code size=$(stat -c%s /tmp/f.zip)"
            if [ "$code" = 200 ]; then unzip -l /tmp/f.zip; unzip -p /tmp/f.zip '*.csv' | iconv -f cp950 -t utf-8 2>/dev/null | head -5 || unzip -p /tmp/f.zip '*.csv' | head -5; break; fi
          done
          curl -sS -o /dev/null -w "hpb %{http_code}\n" -A "Mozilla/5.0" https://www.hpb.gov.tw/ || true
