name: update-speed-cameras
on:
  schedule:
    - cron: '17 3 1 * *'   # 每月 1 號更新
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_cameras.py speed-watch/src/main/assets/cameras.csv
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add speed-watch/src/main/assets/cameras.csv
          git commit -m "update speed cameras $(date +%Y-%m-%d)" || echo "no change"
          git push
