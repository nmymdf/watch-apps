name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate watch faces (official Watch Face Format validator)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/wff
          (cd /tmp/wff/third_party/wff && ./gradlew -q :specification:validator:executable-jar)
          for f in */src/main/res/raw/watchface.xml; do
            echo "== $f" | tee -a /tmp/wff-report.txt
            java -jar /tmp/wff/third_party/wff/specification/validator/build/libs/wff-validator.jar 2 "$f" 2>&1 | tee -a /tmp/wff-report.txt
          done

      - name: Build debug APKs (all modules)
        run: gradle assembleDebug --no-daemon

      - name: Publish APKs to the apk branch
        run: |
          mkdir -p /tmp/out
          for d in */; do
            d=${d%/}
            f="$d/build.gradle.kts"
            [ -f "$f" ] || continue
            apk=$(ls "$d"/build/outputs/apk/debug/*-debug.apk 2>/dev/null | head -1)
            [ -n "$apk" ] || continue
            ver=$(grep -oP 'versionName = "\K[^"]+' "$f")
            cp "$apk" "/tmp/out/${d}-v${ver}.apk"
          done
          ls -l /tmp/out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin apk >/dev/null 2>&1; then
            git fetch origin apk
            git checkout -f -B apk-tmp origin/apk
          else
            git checkout --orphan apk-tmp
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/out/*.apk .
          cp /tmp/wff-report.txt . 2>/dev/null || true
          git add ./*.apk
          git add wff-report.txt 2>/dev/null || true
          git commit -m "APKs from ${GITHUB_SHA::7}" || echo "nothing to commit"
          git push origin HEAD:apk
